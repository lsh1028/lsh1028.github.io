<!DOCTYPE html>
<html lang="ko">
<head>

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #F8F9FA;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
